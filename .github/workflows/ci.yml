name: CI
on:
  push:
    branches: [main, master]
  pull_request:
jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install SDL2
        run: sudo apt-get update && sudo apt-get install -y libsdl2-dev
      - name: Build (Linux)
        run: make
      - name: Unit tests
        run: make tests
      - name: Package
        run: make dist
      - uses: actions/upload-artifact@v4
        with:
          name: ragerecomp-linux
          path: dist/
  windows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install MinGW
        run: sudo apt-get update && sudo apt-get install -y mingw-w64
      - name: Build (Windows x64)
        run: make windows
      - name: Run tests (Wine)
        run: |
          sudo apt-get install -y wine64
          for t in build-win/t_*.exe; do echo "== $t"; wine64 "$t" || exit 1; done
      - uses: actions/upload-artifact@v4
        with:
          name: ragerecomp-windows
          path: build-win/*.exe
