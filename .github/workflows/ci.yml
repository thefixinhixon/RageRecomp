# Builds Linux and Windows and runs the unit tests (Windows under Wine) on
# every push. No game files are involved.
name: CI
on:
  push:
    branches: [main, master]
  pull_request:
jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install SDL2
        run: sudo apt-get update -q && sudo apt-get install -qy libsdl2-dev
      - name: Build (Linux)
        run: make
      - name: Unit tests
        run: make tests
  windows:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install MinGW and Wine
        run: sudo apt-get update -q && sudo apt-get install -qy gcc-mingw-w64-x86-64 wine64
      - name: Build (Windows x64, headless program and tests)
        run: make windows
      - name: Unit tests (Wine)
        run: for t in build-win/t_*.exe; do echo "== $t"; wine64 "$t" || exit 1; done
